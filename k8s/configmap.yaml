apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-api-config
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOST: "0.0.0.0"
  LOG_LEVEL: "info"
  API_PREFIX: "/api"
  API_VERSION: "v1"
  CORS_ORIGIN: "https://yourdomain.com"
  CORS_CREDENTIALS: "true"
  HTTPS_ONLY: "true"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_TIME_WINDOW: "60000"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  SWAGGER_ENABLED: "false"
  SWAGGER_PATH: "/documentation"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "platform-api"
  SECRETS_PROVIDER: "env"
  # Override OTEL_EXPORTER_OTLP_ENDPOINT in your secrets/env to point at your
  # OTel collector (e.g. Jaeger, Honeycomb, Grafana Cloud OTLP).
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
