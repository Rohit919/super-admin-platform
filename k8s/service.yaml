apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# Headless service for direct pod addressing (useful for Prometheus scraping
# and service mesh mTLS without a load-balancer hop).
apiVersion: v1
kind: Service
metadata:
  name: platform-api-headless
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
# Worker metrics service for Prometheus scraping.
apiVersion: v1
kind: Service
metadata:
  name: platform-worker-metrics
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-worker
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: platform-worker
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
      protocol: TCP
