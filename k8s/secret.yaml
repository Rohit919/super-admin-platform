################################################################################
# DO NOT commit real secret values here.
# This file is a template — use a secrets manager (Doppler, Vault, AWS SSM,
# Sealed Secrets, External Secrets Operator) to inject real values at deploy time.
################################################################################
apiVersion: v1
kind: Secret
metadata:
  name: platform-api-secrets
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres-service:5432/fastify_prod?sslmode=require"
  DATABASE_DIRECT_URL: "postgresql://user:password@postgres-primary:5432/fastify_prod?sslmode=require"
  REDIS_URL: "redis://:password@redis-service:6379"
  JWT_SECRET: "REPLACE_WITH_MIN_32_CHAR_RANDOM_STRING"
  COOKIE_SECRET: "REPLACE_WITH_MIN_32_CHAR_RANDOM_STRING"
  METRICS_TOKEN: "REPLACE_WITH_METRICS_BEARER_TOKEN"
  JWT_EXPIRES_IN: "15m"
  REFRESH_TOKEN_EXPIRES_IN: "7d"
