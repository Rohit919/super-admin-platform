global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Wire Alertmanager so evaluated rules can fire notifications.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "platform-api"
    static_configs:
      - targets: ["host.docker.internal:3000"]
    metrics_path: "/metrics"

  - job_name: "platform-worker"
    static_configs:
      - targets: ["host.docker.internal:9101"]
    metrics_path: "/metrics"
